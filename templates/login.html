<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="author" content="Tobias Velez">

    <meta
        name="description"
        content="Portal Álmico - Terapias vibracionales para la sanación del alma">

    <meta
        name="keywords"
        content="terapia, reiki, energia, alma, berazategui, portal almico">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Great+Vibes&family=Lato:wght@300;400;700&family=Montserrat:wght@300;400;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS propio -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/login.css') }}">

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/x-icon"
        href="{{ url_for('static', path='imagenes/logo.svg') }}">

    <title>Portal Álmico - Iniciar sesión</title>
</head>

<body
    data-mensaje="{{ mensaje or '' }}"
    data-tipo="{{ tipo or '' }}">

    <main class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card shadow p-4 rounded-4 w-100 card_login">

            <img
                src="{{ url_for('static', path='imagenes/logo.svg') }}"
                alt="Logo de Portal Álmico"
                width="300"
                class="d-block mx-auto img-fluid">

            <h1 class="titulo text-center mb-4">
                ¡Bienvenido a Portal Álmico!
            </h1>

            <form action="/admin/login" method="POST">

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label fw-bold">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="ejemplo@gmail.com"
                        autocomplete="email"
                        required>

                </div>

                <div class="mb-4">

                    <label
                        for="contrasena"
                        class="form-label fw-bold">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        class="form-control"
                        placeholder="Ingresá tu contraseña"
                        autocomplete="current-password"
                        required>

                </div>

                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg">
                        Iniciar sesión
                    </button>

                </div>

            </form>

            <div class="text-center mt-4">

                <p class="mb-1">
                    ¿Aún no tenés una cuenta?
                </p>

                <a href="/admin/registro">
                    Registrarse aquí
                </a>

            </div>

        </div>

    </main>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- JavaScript propio -->
    <script src="{{ url_for('static', path='js/login.js') }}"></script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
