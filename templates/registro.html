<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Tobias Velez">
    <meta name="description" content="Portal Álmico - Terapias vibracionales para la sanación del alma">
    <meta name="keywords" content="terapia, reiki, energia, alma, berazategui, portal almico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Great+Vibes&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Great+Vibes&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
    <link rel="icon" type="image/x-icon" href="/static/imagenes/logo.svg">
    
    <title>Portal Álmico</title>
</head>
<body data-mensaje="{{ mensaje or '' }}" data-tipo="{{ tipo or '' }}">

    <main class="container d-flex justify-content-center align-items-center min-vh-100 py-5">

        <div
            class="card border-0 shadow p-4 p-md-5 rounded-4 w-100"
            style="max-width: 520px;">

            <div class="text-center mb-4">

                <img
                    src="/static/imagenes/logo.svg"
                    alt="Logo de Portal Álmico"
                    width="200"
                    class="mb-3">

                <h1 class="fw-bold fs-2">
                    Crear una cuenta
                </h1>

                <p class="text-muted mb-0">
                    Registrate en Portal Álmico
                </p>

            </div>

            <form action="/usuarios/registro" method="POST">

                <div class="mb-3">

                    <label
                        for="nombreApellido"
                        class="form-label fw-semibold fs-4">
                        Nombre y apellido
                    </label>

                    <input
                        type="text"
                        id="nombreApellido"
                        name="nombreApellido"
                        class="form-control form-control-lg fs-4"
                        placeholder="Ej: Tobias Velez"
                        autocomplete="name"
                        required>

                </div>

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label fw-semibold fs-4">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control form-control-lg"
                        placeholder="ejemplo@gmail.com"
                        autocomplete="email"
                        required>

                </div>

                <div class="mb-3">

                    <label
                        for="telefono"
                        class="form-label fw-semibold fs-4">
                        Número de teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        class="form-control form-control-lg"
                        placeholder="Ej: 1122334455"
                        autocomplete="tel"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required>

                    <div class="form-text">
                        Ingresá 10 números sin espacios ni guiones.
                    </div>

                </div>

                <div class="mb-3">

                    <label
                        for="contrasena"
                        class="form-label fw-semibold fs-4">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        class="form-control form-control-lg"
                        placeholder="Ingresá una contraseña"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                </div>

                <div class="mb-4">

                    <label
                        for="confirmarContrasena"
                        class="form-label fw-semibold fs-4">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmarContrasena"
                        name="confirmarContrasena"
                        class="form-control form-control-lg"
                        placeholder="Repetí la contraseña"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                    <div
                        id="error-contrasena"
                        class="text-danger mt-2 d-none">
                        Las contraseñas no coinciden.
                    </div>

                </div>

                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-lg rounded-pill fw-bold"
                        style="background-color: #b4936d; color: white;">
                        Registrarme
                    </button>

                </div>

            </form>

            <div class="text-center mt-4">

                <p class="mb-1">
                    ¿Ya tenés una cuenta?
                </p>

                <a
                href="/admin/login"
                class="fw-semibold text-decoration-none">
                Iniciar sesión
                </a>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', path='js/registro.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
